apiVersion: apps/v1
kind: Deployment
metadata: { name: hallumark, labels: { app: hallumark } }
spec:
  replicas: 1
  selector: { matchLabels: { app: hallumark } }
  template:
    metadata: { labels: { app: hallumark } }
    spec:
      containers:
        - name: hallumark
          image: ghcr.io/cognis-digital/hallumark:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: hallumark }
spec:
  selector: { app: hallumark }
  ports: [{ port: 80, targetPort: 8000 }]
